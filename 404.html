<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetínem – průvodce &amp; příběhy</title>
<style>
  :root { --bg:#f1e6c8; --ink:#34261a; --rust:#8c4628; --line:#cdb98c; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px 48px; text-align:center; }
  h1 { font-size:30px; letter-spacing:2px; margin:0; }
  .sub { letter-spacing:3px; font-size:13px; margin-bottom:24px; }
  .place { border:2px solid var(--line); border-radius:12px; background:#fbf4e2; padding:16px; margin:20px 0; text-align:left; }
  .place h2 { margin:0 0 6px; color:var(--rust); font-size:22px; }
  .stores { display:flex; flex-direction:column; gap:10px; margin:24px 0; }
  .stores a { display:block; padding:14px; border-radius:12px; background:var(--ink); color:#fff; text-decoration:none; font-weight:bold; }
  .stores a.soon { opacity:.55; pointer-events:none; }
  nav { display:flex; justify-content:center; gap:8px; margin-bottom:16px; }
  nav button { font-size:22px; background:none; border:1px solid var(--line); border-radius:20px; padding:2px 10px; cursor:pointer; }
  .small { font-size:13px; opacity:.75; }
</style>
</head>
<body>
<main>
  <nav>
    <button data-l="cs" aria-label="Čeština">🇨🇿</button><button data-l="en" aria-label="English">🇬🇧</button>
    <button data-l="de" aria-label="Deutsch">🇩🇪</button><button data-l="es" aria-label="Español">🇪🇸</button>
  </nav>
  <h1>TETÍNEM</h1>
  <div class="sub" id="sub"></div>
  <div class="place" id="place" hidden><h2 id="pname"></h2><div id="pintro"></div></div>
  <p id="lead"></p>
  <div class="stores">
    <!-- Po zveřejnění v obchodech sem doplnit odkazy a odebrat class="soon" -->
    <a id="ios" class="soon" href="#">App Store</a>
    <a id="android" class="soon" href="#">Google Play</a>
  </div>
  <p class="small" id="soon"></p>
  <p class="small"><a id="privacy" href="/tetinem-admin/privacy/"></a></p>
</main>
<script>
(function () {
  var T = {
    cs: { sub: 'PRŮVODCE & PŘÍBĚHY', lead: 'Stáhněte si aplikaci Tetínem a naskenujte kód v ní – příběh tohoto místa se hned spustí.', soon: 'Aplikace bude brzy k dispozici.', privacy: 'Ochrana soukromí', notfound: 'Stránka nenalezena.' },
    en: { sub: 'GUIDE & STORIES', lead: 'Get the Tetínem app and scan the code in it – the story of this place starts right away.', soon: 'The app is coming soon.', privacy: 'Privacy policy', notfound: 'Page not found.' },
    de: { sub: 'FÜHRER & GESCHICHTEN', lead: 'Laden Sie die App Tetínem herunter und scannen Sie den Code darin – die Geschichte dieses Ortes startet sofort.', soon: 'Die App ist bald verfügbar.', privacy: 'Datenschutz', notfound: 'Seite nicht gefunden.' },
    es: { sub: 'GUÍA E HISTORIAS', lead: 'Descargue la app Tetínem y escanee el código en ella: la historia de este lugar empezará enseguida.', soon: 'La aplicación estará disponible pronto.', privacy: 'Privacidad', notfound: 'Página no encontrada.' }
  };
  var SB = 'https://kpjnokcqobbykdjgfatu.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtwam5va2Nxb2JieWtkamdmYXR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MTAyODAsImV4cCI6MjEwNzI4NjI4MH0.OkXL_A0Bq5T6xwE17KY6LNEpWQdONDKyhHnY3pTbMF4';
  var parts = location.pathname.split('/').filter(Boolean);
  var qi = parts.indexOf('q');
  var code = qi >= 0 ? parts[qi + 1] : null;
  var lang = (navigator.language || 'cs').slice(0, 2);
  if (!T[lang]) lang = lang === 'sk' ? 'cs' : 'en';

  function show(l) {
    lang = l;
    document.documentElement.lang = l;
    var t = T[l];
    document.getElementById('sub').textContent = t.sub;
    document.getElementById('lead').textContent = code ? t.lead : t.notfound;
    document.getElementById('soon').textContent = t.soon;
    document.getElementById('privacy').textContent = t.privacy;
    if (code) loadPlace();
  }

  function loadPlace() {
    fetch(SB + '/rest/v1/rpc/get_content', {
      method: 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ lang: lang })
    }).then(function (r) { return r.json(); }).then(function (c) {
      var p = (c.places || []).filter(function (x) { return x.qr === code || x.id === code; })[0];
      if (!p) return;
      document.getElementById('pname').textContent = p.name;
      document.getElementById('pintro').textContent = p.intro || '';
      document.getElementById('place').hidden = false;
    }).catch(function () {});
  }

  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () { show(b.getAttribute('data-l')); });
  });
  show(lang);
})();
</script>
</body>
</html>
